<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendário de Jogos - NWL Copa</title>
    <link rel="stylesheet" href="./style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="green">
    <div id="app">
      <header>
        <img src="./assets/logo.svg" alt="Logo da NLW" />
        <nav class="nav-tabs">
          <button class="tab-btn active" data-page="games">🏆 Jogos</button>
          <button class="tab-btn" data-page="groups">📊 Grupos</button>
        </nav>
      </header>

      <!-- Página de Jogos -->
      <main id="games-page" class="page active">
        <div id="games-content"></div>
      </main>

      <!-- Página de Grupos -->
      <main id="groups-page" class="page">
        <div id="groups-content"></div>
      </main>
    </div>
    
    <script src="./main.js"></script>
  </body>
</html>
